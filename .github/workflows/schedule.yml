name: Bursa Market Accurate Tracker

on:
  schedule:
    # 09:30 UTC = 17:30 (5:30 PM) Malaysia Time (UTC+8), Monday through Friday
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # Allows manual one-click runs from GitHub Actions UI

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Tracker Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python tracker.py

      - name: Commit & Push Updated Ranking History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ranking_history.json
          git commit -m "chore: update Bursa ranking history cache [skip ci]" || echo "No ranking displacement changes to commit."
          git push
